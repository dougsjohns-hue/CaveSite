<div style="
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(260px, 300px)); 
  gap: 28px; 
  justify-content: center; 
  align-items: stretch; 
  padding: 40px 20px; 
  background: #263FFF; 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
">

  <!-- Ford Mustang RC Car -->
  <div style="
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    background: rgba(255, 255, 255, 0.15); 
    padding: 20px; 
    border-radius: 14px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); 
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  ">
    <h3 style="margin: 0 0 14px 0; font-size: 1.1rem; font-weight: 700; text-align: center; color: #8b0000; letter-spacing: 0.3px;">Ford Mustang RC Car</h3>
    <img 
      src="Ford Mustang RC Car.jpg"
      alt="Ford Mustang RC Car.jpg" 
      style="max-width: 100%; max-height: 320px; width: auto; height: auto; object-fit: contain; border-radius: 8px;" 
    />
    <hr style="width: 100%; border: none; border-top: 1px solid rgba(139, 0, 0, 0.4); margin: 16px 0 0 auto;">
  </div>
